                - link "近日.我畢業了.結束了三年的高中生活. 我的高中其實跟別人不太一樣.別人可能都是大早晨起來.固定的同學老師.不停的讀書刷題.奔向非常高的目標.但我不一樣.高中前二分之一的時間.我都拿去玩——看演出.組樂隊.自己去演出.以及第一年入學我患上嚴重的精神疾病.吃藥把自己吃的渾渾噩噩.每天都在睡覺.跟朋友翹課去看海.不斷的做互聯網…我討厭補課.討厭老師.討厭一切讓自己壓力非常大的事情. 到了高二.我好像意識到再這樣下去大學都上不了.於是客服自己的恐懼.嘗試去補課.老師們都對我很照顧.我也開始努力練習專業與文化.終於提高了雙倍的成績… 互聯網的作用下.我也認識了很多非常優秀的樂手老師們.他們一直在給我很大的鼓勵.讓我好好彈琴.好好考學…也給我了一個非常大的機會去演出.上大舞臺.我非常感謝他們對我的期望與陪伴.所以在畢業後我也馬上到達現場觀看他們的演出. 其實.我更加希望大家們有健康的心理和生理狀態去迎接未來.所以不要給自己過多的壓力.好好照顧身體.這是我的高中總結. 也希望我的成績理想.考到自己心儀的大學.繼續玩音樂！ Carousel" [ref=e968] [cursor=pointer]:
                  - /url: /mainpapyuz002/p/DZm3CR9Dsmx/
                  - img "近日.我畢業了.結束了三年的高中生活. 我的高中其實跟別人不太一樣.別人可能都是大早晨起來.固定的同學老師.不停的讀書刷題.奔向非常高的目標.但我不一樣.高中前二分之一的時間.我都拿去玩——看演出.組樂隊.自己去演出.以及第一年入學我患上嚴重的精神疾病.吃藥把自己吃的渾渾噩噩.每天都在睡覺.跟朋友翹課去看海.不斷的做互聯網…我討厭補課.討厭老師.討厭一切讓自己壓力非常大的事情. 到了高二.我好像意識到再這樣下去大學都上不了.於是客服自己的恐懼.嘗試去補課.老師們都對我很照顧.我也開始努力練習專業與文化.終於提高了雙倍的成績… 互聯網的作用下.我也認識了很多非常優秀的樂手老師們.他們一直在給我很大的鼓勵.讓我好好彈琴.好好考學…也給我了一個非常大的機會去演出.上大舞臺.我非常感謝他們對我的期望與陪伴.所以在畢業後我也馬上到達現場觀看他們的演出. 其實.我更加希望大家們有健康的心理和生理狀態去迎接未來.所以不要給自己過多的壓力.好好照顧身體.這是我的高中總結. 也希望我的成績理想.考到自己心儀的大學.繼續玩音樂！" [ref=e971]
