              - generic [ref=e752]:
                - 'link "Midnight Echo 2026.7.24 Release 🌙 東京の夜。 静かなネオン。 過ぎ去った記憶。 Jazz、City Pop、そして深夜の空気を織り交ぜた “Misa Sugiyama”による5曲入りEP。 「真夜中のドア」 「Fly-day Chinatown」などのカバーに加え、 オリジナル曲「なくした記憶」「輝く月」を収録。 夜の帰り道や、静かな夜に そっと寄り添えたら嬉しいです✨ 2026年7月24日 リリース。 ストリーミング予約、Pre-Add / Pre-Saveはこちらから↓↓↓ https://linkco.re/vGyV4Qc7 応援していただけたらとても嬉しいです✨ @arata_ume @konmaritrumpet Midnight Echo Out July 24, 2026!! Tokyo nights. Quiet neon lights. Fading memories. A 5-track EP by Misa Sugiyama, blending Jazz, City Pop, and the atmosphere of midnight. Featuring covers of “Mayonaka no Door” and “Fly-day Chinatown,” alongside the original songs “Lost Memories” and “Shining Moon.” I hope these songs can gently accompany your late-night drives and sleepless evenings. Pre-save / Pre-add here ↓↓↓ https://linkco.re/vGyV4Qc7 Your support would truly mean a lot to me ✨ #flydaychinatown #CityPop #真夜中のドアstaywithme #midnightecho #misasugiyama Clip" [ref=e754] [cursor=pointer]':
