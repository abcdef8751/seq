                - 'link "\"Midnight Echo 2026.7.24 Release https://linkco.re/vGyV4Qc7 横浜中華街は、私にとって特別な思い出の場所。 小学生の頃、日本へ帰国してからも英語を忘れないように、毎週土曜日は元町・中華街にある学校へ通っていました。 そして高校生になると、今度はジャズを歌うために横浜へ。 子どもから大人へと変わっていく、多感な時期を過ごした街だからこそ、横浜は今でも私の”セカンドホーム”です。 そんな思い出の街を思い浮かべながら歌った Fly-day Chinatown。 ぜひ聴いていただけたら嬉しいです。✨ 『Midnight Echo』 2026.7.24 Release 🌙 Yokohama Chinatown holds a very special place in my heart. After returning to Japan as a child, I went to a school in Motomachi-Chukagai every Saturday so I wouldn’t forget my English. Later, in high school, I found myself going back to Yokohama, this time to sing jazz. I spent some of my most sensitive and formative years in that city, and even now, Yokohama still feels like my second home. Singing Fly-day Chinatown brought back so many memories. I hope you enjoy it. ✨ #flydaychinatown #yokohama #jazzsinger #japanesesinger #midnightecho Clip" [ref=e760] [cursor=pointer]':
