                      - text: Neon Genesis Evangelion is a psychological mecha anime created by Hideaki Anno and first released in 1995 by studio Gainax. Set in a world recovering from a global catastrophe known as the Second Impact, the story follows 14-year-old Shinji Ikari, who is recruited by the organization NERV to pilot a giant biomechanical weapon called an Evangelion and fight mysterious beings known as Angels threatening humanity's survival.
                      - text: What starts as a sci-fi action anime slowly becomes something much deeper exploring depression, loneliness, trauma, identity, and the fear of human connection. Evangelion became legendary not only for its intense battles and iconic visuals, but for the emotional and philosophical themes hidden underneath the story.
                      - text: The series completely changed anime culture, influencing countless shows that came after it, and is still considered one of the greatest and most important anime ever made. From its unforgettable soundtrack to its symbolic storytelling and mind-bending ending, Evangelion is more than just an anime it's an experience that stays with you long after watching.
