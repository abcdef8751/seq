                - link "追加公演、台北、福岡、札幌、ありがとうございました。 初の海外、台北で待っていてくれた貴方がいてくれて、 福岡、札幌でも皆さんと出会うことができて、 あぁ、やっぱり私は歌を歌わせてもらえるんだな、 と感じさせてもらえた２週間でした。 信じることや諦めることと向き合う日々の中で ライブでの皆との瞬間は 何よりも本物で 代え難いものです。 ピンチの時でも なんとか持ち直し 歌うことを選ばされてきたような私ですが、 ライブで皆さんの表情を見れた時、 「感動した！」と言ってもらえた時、 「あの時、歌うことを選んでよかった」 と思います。 生きていくことは立ち止まることも多くて、 嫌な自分や空っぽな心と向き合うこともあるけど それが力になっていく瞬間を これからも歌っていたい。 『シオン』の歌詞 「邂逅うことは必然だから」 その言葉が3公演ともなんだかいつもと違う響きがある気がしました。 最高の夜をありがとう。 次は9月。 また会えますように。 Carousel" [ref=e997] [cursor=pointer]:
