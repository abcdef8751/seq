                - 'link "『Myuk Anniversary Concert Tour 2026』 東名阪3公演、一緒に作ってくれた皆さん ありがとうございました。 どの夜も、まさに果てしない空っぽな心が没入感と多幸感で満たされていくようなこの上なく優しい空間でした。 デビュー5周年の年に、夢だったZeppのステージに立てたこと、これまでMyukの音楽に出会ってくれた全ての方々のおかげです。今日まで、本当にありがとう。 音楽を通してあなたと出会えたことがとても嬉しいです。 ここからまた、旅が始まります。 他でもない貴方の旅路に色を添えられる音楽を、 苦しい夜にそっと隣に居られる音楽を、 歌って、届けていけたらと思います。 そんな想いを以前に増して強く感じた、皆んなの存在に勇気をもらった3公演でした。 最強にかっこいい音でライブを彩ってくださった尊敬するバンドメンバー、 そして照明や音響、演出等、このツアーに関わってくださった全ての方に心からの感謝を込めて。 次は追加公演、5月台北、福岡、札幌で会えますように。 5周年、まだ始まったばかりです。 𓈒 𓏸 𓐍 𓂃 𓈒𓏸 𓂃◌𓈒𓐍 𓈒 𓏸 𓐍 𓂃 𓈒𓏸 𓂃◌𓈒𓐍 Piano : 西野恵未 @emi_nishino Guitar : 大久保 友裕 Bass : 山口寛雄 Drums : 大貫みく(the peggies) @minimiku0423 Direction : 中山佳香 @yoshikanakayama Stylist : masumi yakuzawa @masumi_yakuzawa Hair&Makeup : 金澤美保 @kanesawamiho 追加公演のチケットも好評発売中✨ 5月は福岡・北海道へ！ 🎫 5/18(月) 福岡・INSA 🎫 5/23(土) 札幌近松 各プレイガイドにて受付中👇 🎟 ローチケ：l-tike.com/myuk/ 🎟 イープラス：eplus.jp/myuk/ 🎟 ぴあ：w.pia.jp/t/myuk/ #Celeste_Tour Carousel" [ref=e1016] [cursor=pointer]':
