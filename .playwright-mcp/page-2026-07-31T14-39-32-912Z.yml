                            - generic [ref=e945]: i kept experiencing the same energy disguising itself as several different people that i find attractive to try to have (you know what) with me. i would dream every single night, wake up with scratches and bruises, i always felt like i was being watched, my dreams were always insanely vivid, and i experienced paranormal things. one night i was sleeping, and i was in a phase right between sleep and consciousness. i heard a clap right by my ear. i physically jolted, and retreated deeper beneath my covers. i remember whimpering, i might have cried. i also heard this gross man’s voice yell “HEY!” i did my best to block out the rest of what he said, but it was absolutely horrifying. i couldn’t talk about what was happening to me without crying. my dreams are always unbelievably realistic. everything works as it should, i can read, i can run, i can do everything. so in these dreams when it would hurt me, i could feel everything. i had to cleanse my entire living space and wear a protection ward necklace to sleep every night to get rid of it. i still don’t know what that thing was.
