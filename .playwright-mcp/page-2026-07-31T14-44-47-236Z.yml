                      - text: "• 𝗔𝗻𝗶𝗺𝗲: The Devil Is a Part-Timer! (Hataraku Maou-sama!)"
                      - text: "• 𝗦𝘁𝗮𝘁𝘂𝘀: 3 Seasons | 37 Episodes (Completed September 2023)"
                      - text: "• 𝗥𝗮𝘁𝗶𝗻𝗴: ⭐ 7.7/10"
                      - text: "• 𝗚𝗲𝗻𝗿𝗲: 🍔 Reverse Isekai | 🎭 Workplace Comedy | 🔮 Fantasy"
                      - text: "--- 🌀 StorylineStripped of his dark magic after a crushing defeat by the Hero Emilia in the fantasy realm of Ente Isla, the formidable Demon Lord Satan is forced to retreat through a dimensional portal. He lands directly in modern-day Tokyo, Japan, alongside his intensely loyal general, Alciel. Stranded in a world completely lacking in magic, the dark lord adopts the human alias Sadao Maou and is forced to confront the ultimate human hurdle: capitalism. To pay his rent and survive, he takes a humble part-time job flipping burgers at a local fast-food joint called MgRonald's. His terrifying demonic ambitions are quickly replaced by an intense drive to climb the corporate fast-food ladder and become a model employee. However, his new mundane lifestyle is constantly thrown into chaos when the Hero Emilia tracks him down, working at a nearby call center to keep an eye on him. Alongside high school coworker Chiho and a wacky cast of angels, assassins, and fallen demons, the series delivers a hilarious, action-packed subversion of the typical fantasy trope."
                      - text: "--- 🔍 KeywordsSadao Maou, Demon Lord Satan, Hero Emilia, Emi Yusa, MgRonalds, Reverse Isekai, White Fox, Studio 3Hz, Shiro Ashiya, Chiho Sasaki, Satoshi Wagahara, Ente Isla."
