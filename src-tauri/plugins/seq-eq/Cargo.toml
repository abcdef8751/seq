[package]
name = "tauri-plugin-seq-eq"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-seq-eq"

[lib]
name = "tauri_plugin_seq_eq"
crate-type = ["rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
